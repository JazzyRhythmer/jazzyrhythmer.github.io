<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1200" viewBox="0 0 860 1200"><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:monospace;letter-spacing:1px}</style><rect x="0" y="0" width="860" height="1200" fill="#0c0d0d" stroke="#494b4b"/><text x="32" y="42" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">RHYTHMER OS / FOR MPC SAMPLE</text><text x="638" y="42" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">01 / KEEP CLOSE</text><path d="M32,62 L828,62" stroke="#494b4b"/><text x="32" y="98" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">THE CONTROLS YOU NEED FIRST</text><text x="32" y="158" font-size="48" fill="#eeeeee" font-weight="700">Essential controls.</text><text x="32" y="216" font-size="48" fill="#eeeeee" font-weight="700">Buttons and results.</text><text x="32" y="252" font-size="14" fill="#eeeeee" font-weight="700">Push means click. Turn means rotate. Read the current B1–B3 labels.</text><rect x="32" y="282" width="392" height="158" fill="#131515" stroke="#494b4b"/><text x="46" y="307" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">01</text><text x="70" y="307" font-size="12" fill="#eeeeee" font-weight="700">GO BACK</text><rect x="46" y="326" width="53" height="32" fill="#202222" stroke="#494b4b"/><text x="55" y="347" font-size="11" fill="#eeeeee" font-weight="700">SHIFT</text><text x="107" y="348" font-size="13" fill="#aaaaaa" font-weight="400">+</text><rect x="123" y="326" width="102" height="32" fill="#202222" stroke="#494b4b"/><text x="132" y="347" font-size="11" fill="#eeeeee" font-weight="700">ENCODER PUSH</text><text x="46" y="385" font-size="12" fill="#aaaaaa" font-weight="400">Return or cancel. GEN subpages return to GEN first. In</text><text x="46" y="403" font-size="12" fill="#aaaaaa" font-weight="400">MENU, Shift + Push follows B1 BACK.</text><rect x="436" y="282" width="392" height="158" fill="#131515" stroke="#494b4b"/><text x="450" y="307" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">02</text><text x="474" y="307" font-size="12" fill="#eeeeee" font-weight="700">OPEN TRACKS</text><rect x="450" y="326" width="60" height="32" fill="#202222" stroke="#494b4b"/><text x="459" y="347" font-size="11" fill="#eeeeee" font-weight="700">PAD FX</text><text x="518" y="348" font-size="13" fill="#aaaaaa" font-weight="400">+</text><rect x="534" y="326" width="67" height="32" fill="#202222" stroke="#494b4b"/><text x="543" y="347" font-size="11" fill="#eeeeee" font-weight="700">KNOB FX</text><text x="450" y="385" font-size="12" fill="#aaaaaa" font-weight="400">Press together. Select a track; Push opens its sound.</text><text x="450" y="403" font-size="12" fill="#aaaaaa" font-weight="400">B1 TRACK SETUP changes its instrument or type.</text><rect x="32" y="452" width="392" height="158" fill="#131515" stroke="#494b4b"/><text x="46" y="477" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">03</text><text x="70" y="477" font-size="12" fill="#eeeeee" font-weight="700">SELECT A TRACK</text><rect x="46" y="496" width="74" height="32" fill="#202222" stroke="#494b4b"/><text x="55" y="517" font-size="11" fill="#eeeeee" font-weight="700">PAD BANK</text><text x="128" y="518" font-size="13" fill="#aaaaaa" font-weight="400">+</text><rect x="144" y="496" width="74" height="32" fill="#202222" stroke="#494b4b"/><text x="153" y="517" font-size="11" fill="#eeeeee" font-weight="700">PAD 1–16</text><text x="46" y="555" font-size="12" fill="#aaaaaa" font-weight="400">Hold PAD BANK, tap the track pad, then release. Check</text><text x="46" y="573" font-size="12" fill="#aaaaaa" font-weight="400">the track number in the header.</text><rect x="436" y="452" width="392" height="158" fill="#131515" stroke="#494b4b"/><text x="450" y="477" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">04</text><text x="474" y="477" font-size="12" fill="#eeeeee" font-weight="700">OPEN THE SOUND</text><rect x="450" y="496" width="60" height="32" fill="#202222" stroke="#494b4b"/><text x="459" y="517" font-size="11" fill="#eeeeee" font-weight="700">SAMPLE</text><text x="450" y="555" font-size="12" fill="#aaaaaa" font-weight="400">Stage is the selected track’s sound home. Return here</text><text x="450" y="573" font-size="12" fill="#aaaaaa" font-weight="400">from PATTERNS to play its instrument.</text><rect x="32" y="622" width="392" height="158" fill="#131515" stroke="#494b4b"/><text x="46" y="647" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">05</text><text x="70" y="647" font-size="12" fill="#eeeeee" font-weight="700">OPEN PATTERNS</text><rect x="46" y="666" width="48" height="32" fill="#202222" stroke="#494b4b"/><text x="55" y="687" font-size="11" fill="#eeeeee" font-weight="700">SEQ</text><text x="102" y="688" font-size="13" fill="#aaaaaa" font-weight="400">→</text><rect x="118" y="666" width="95" height="32" fill="#202222" stroke="#494b4b"/><text x="127" y="687" font-size="11" fill="#eeeeee" font-weight="700">B1 PATTERNS</text><text x="46" y="725" font-size="12" fill="#aaaaaa" font-weight="400">SEQ opens SEQUENCES for all tracks. B1 PATTERNS opens</text><text x="46" y="743" font-size="12" fill="#aaaaaa" font-weight="400">the selected track’s patterns.</text><rect x="436" y="622" width="392" height="158" fill="#131515" stroke="#494b4b"/><text x="450" y="647" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">06</text><text x="474" y="647" font-size="12" fill="#eeeeee" font-weight="700">SAVE YOUR PROJECT</text><rect x="450" y="666" width="53" height="32" fill="#202222" stroke="#494b4b"/><text x="459" y="687" font-size="11" fill="#eeeeee" font-weight="700">SHIFT</text><text x="511" y="688" font-size="13" fill="#aaaaaa" font-weight="400">+</text><rect x="527" y="666" width="60" height="32" fill="#202222" stroke="#494b4b"/><text x="536" y="687" font-size="11" fill="#eeeeee" font-weight="700">PAD 16</text><text x="595" y="688" font-size="13" fill="#aaaaaa" font-weight="400">→</text><rect x="611" y="666" width="67" height="32" fill="#202222" stroke="#494b4b"/><text x="620" y="687" font-size="11" fill="#eeeeee" font-weight="700">B1 SAVE</text><text x="450" y="725" font-size="12" fill="#aaaaaa" font-weight="400">First SAVE chooses a folder/name. On Project, SHIFT +</text><text x="450" y="743" font-size="12" fill="#aaaaaa" font-weight="400">B1 is SAVE AS; SHIFT + B3 opens RECOVERY.</text><rect x="32" y="792" width="392" height="158" fill="#131515" stroke="#494b4b"/><text x="46" y="817" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">07</text><text x="70" y="817" font-size="12" fill="#eeeeee" font-weight="700">FINE-EDIT A VALUE</text><rect x="46" y="836" width="53" height="32" fill="#202222" stroke="#494b4b"/><text x="55" y="857" font-size="11" fill="#eeeeee" font-weight="700">SHIFT</text><text x="107" y="858" font-size="13" fill="#aaaaaa" font-weight="400">+</text><rect x="123" y="836" width="102" height="32" fill="#202222" stroke="#494b4b"/><text x="132" y="857" font-size="11" fill="#eeeeee" font-weight="700">ENCODER TURN</text><text x="46" y="895" font-size="12" fill="#aaaaaa" font-weight="400">On Stage EDIT, touch the target K1–K3 knob first. Shift</text><text x="46" y="913" font-size="12" fill="#aaaaaa" font-weight="400">+ encoder turn fine-adjusts that control.</text><rect x="436" y="792" width="392" height="158" fill="#131515" stroke="#494b4b"/><text x="450" y="817" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">08</text><text x="474" y="817" font-size="12" fill="#eeeeee" font-weight="700">GENERATE AN IDEA</text><rect x="450" y="836" width="53" height="32" fill="#202222" stroke="#494b4b"/><text x="459" y="857" font-size="11" fill="#eeeeee" font-weight="700">SHIFT</text><text x="511" y="858" font-size="13" fill="#aaaaaa" font-weight="400">+</text><rect x="527" y="836" width="60" height="32" fill="#202222" stroke="#494b4b"/><text x="536" y="857" font-size="11" fill="#eeeeee" font-weight="700">B3 GEN</text><text x="450" y="895" font-size="12" fill="#aaaaaa" font-weight="400">From SEQ → B1 PATTERNS. Check the target tracks and</text><text x="450" y="913" font-size="12" fill="#aaaaaa" font-weight="400">SOUND + MIDI / MIDI ONLY before applying.</text><path d="M32,982 L828,982" stroke="#494b4b"/><text x="32" y="1011" font-size="11" fill="#eeeeee" font-weight="700">RECORD</text><text x="32" y="1038" font-size="12" fill="#aaaaaa" font-weight="400">SAMPLE → SEQ RECORD → PLAY. Play</text><text x="32" y="1056" font-size="12" fill="#aaaaaa" font-weight="400">notes on the sound page.</text><text x="306" y="1011" font-size="11" fill="#eeeeee" font-weight="700">UNDO / REDO</text><text x="306" y="1038" font-size="12" fill="#aaaaaa" font-weight="400">SHIFT + − / +. For supported project</text><text x="306" y="1056" font-size="12" fill="#aaaaaa" font-weight="400">edits.</text><text x="580" y="1011" font-size="11" fill="#eeeeee" font-weight="700">CUT STUCK AUDIO</text><text x="580" y="1038" font-size="12" fill="#aaaaaa" font-weight="400">STOP twice within 400 ms. SHIFT +</text><text x="580" y="1056" font-size="12" fill="#aaaaaa" font-weight="400">STOP sends All Notes Off.</text><text x="32" y="1124" font-size="12" fill="#aaaaaa" font-weight="400">NOTE REPEAT / ARP can temporarily replace soft keys with rate choices. Turn it off to restore those menus. In a modal,</text><text x="32" y="1142" font-size="12" fill="#aaaaaa" font-weight="400">finish or cancel first.</text></svg>