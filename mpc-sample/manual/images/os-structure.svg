<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1420" viewBox="0 0 860 1420"><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:monospace;letter-spacing:1px}</style><rect x="0" y="0" width="860" height="1420" fill="#0c0d0d" stroke="#494b4b"/><text x="32" y="42" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">RHYTHMER OS / FOR MPC SAMPLE</text><text x="638" y="42" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">02 / THE BIG PICTURE</text><path d="M32,62 L828,62" stroke="#494b4b"/><text x="32" y="98" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">ONE PROJECT. CONNECTED IDEAS.</text><text x="32" y="158" font-size="48" fill="#eeeeee" font-weight="700">Projects and tracks.</text><text x="32" y="216" font-size="48" fill="#eeeeee" font-weight="700">Patterns and audio.</text><rect x="32" y="250" width="796" height="118" fill="none" stroke="#494b4b"/><text x="52" y="279" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">PROJECT</text><text x="52" y="313" font-size="27" fill="#eeeeee" font-weight="700">Your whole session.</text><text x="52" y="344" font-size="13" fill="#aaaaaa" font-weight="400">Tempo · key / scale · 16 tracks · sequences · arrangement</text><text x="300" y="400" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">↓ CHOOSE ONE OF 16 TRACKS</text><rect x="32" y="420" width="796" height="88" fill="none" stroke="#494b4b"/><text x="52" y="447" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">TRACK</text><text x="52" y="480" font-size="25" fill="#eeeeee" font-weight="700">Sound + patterns + mix</text><rect x="418" y="436" width="44" height="25" fill="#eeeeee" stroke="#494b4b"/><text x="431" y="453" font-size="10" fill="#0c0d0d" font-weight="400" class="mono">01</text><rect x="467" y="436" width="44" height="25" fill="#0c0d0d" stroke="#494b4b"/><text x="480" y="453" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">02</text><rect x="516" y="436" width="44" height="25" fill="#0c0d0d" stroke="#494b4b"/><text x="529" y="453" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">03</text><rect x="565" y="436" width="44" height="25" fill="#0c0d0d" stroke="#494b4b"/><text x="578" y="453" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">04</text><rect x="614" y="436" width="44" height="25" fill="#0c0d0d" stroke="#494b4b"/><text x="627" y="453" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">05</text><rect x="663" y="436" width="44" height="25" fill="#0c0d0d" stroke="#494b4b"/><text x="676" y="453" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">06</text><rect x="712" y="436" width="44" height="25" fill="#0c0d0d" stroke="#494b4b"/><text x="725" y="453" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">07</text><rect x="761" y="436" width="44" height="25" fill="#0c0d0d" stroke="#494b4b"/><text x="774" y="453" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">08</text><rect x="418" y="467" width="44" height="25" fill="#0c0d0d" stroke="#494b4b"/><text x="431" y="484" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">09</text><rect x="467" y="467" width="44" height="25" fill="#0c0d0d" stroke="#494b4b"/><text x="480" y="484" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">10</text><rect x="516" y="467" width="44" height="25" fill="#0c0d0d" stroke="#494b4b"/><text x="529" y="484" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">11</text><rect x="565" y="467" width="44" height="25" fill="#0c0d0d" stroke="#494b4b"/><text x="578" y="484" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">12</text><rect x="614" y="467" width="44" height="25" fill="#0c0d0d" stroke="#494b4b"/><text x="627" y="484" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">13</text><rect x="663" y="467" width="44" height="25" fill="#0c0d0d" stroke="#494b4b"/><text x="676" y="484" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">14</text><rect x="712" y="467" width="44" height="25" fill="#0c0d0d" stroke="#494b4b"/><text x="725" y="484" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">15</text><rect x="761" y="467" width="44" height="25" fill="#0c0d0d" stroke="#494b4b"/><text x="774" y="484" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">16</text><text x="267" y="541" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">↓ BASIC: DRUM / KEYGROUP / PLUGIN</text><rect x="32" y="564" width="256" height="258" fill="#131515" stroke="#494b4b"/><text x="46" y="593" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">PLUGIN</text><text x="46" y="626" font-size="23" fill="#eeeeee" font-weight="700">One instrument.</text><text x="46" y="653" font-size="12" fill="#aaaaaa" font-weight="400">One synth or percussion sound</text><text x="46" y="671" font-size="12" fill="#aaaaaa" font-weight="400">across the keys. Choose its preset;</text><text x="46" y="689" font-size="12" fill="#aaaaaa" font-weight="400">shape it in EDIT.</text><path d="M46,729 L274,729" stroke="#494b4b"/><text x="46" y="753" font-size="12" fill="#eeeeee" font-weight="700">Rhythmer Kit is a plug-in.</text><text x="46" y="778" font-size="12" fill="#aaaaaa" font-weight="400">16 pad sounds, whole-kit presets</text><text x="46" y="796" font-size="12" fill="#aaaaaa" font-weight="400">and per-pad source editing.</text><rect x="302" y="564" width="256" height="258" fill="#131515" stroke="#494b4b"/><text x="316" y="593" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">DRUM</text><text x="316" y="626" font-size="23" fill="#eeeeee" font-weight="700">Your samples.</text><text x="316" y="653" font-size="12" fill="#aaaaaa" font-weight="400">Native Sample Kit. Load samples</text><text x="316" y="671" font-size="12" fill="#aaaaaa" font-weight="400">onto pads or import an MPC kit.</text><text x="316" y="689" font-size="12" fill="#aaaaaa" font-weight="400">Trim, chop, tune and shape each</text><text x="316" y="707" font-size="12" fill="#aaaaaa" font-weight="400">pad.</text><path d="M316,729 L544,729" stroke="#494b4b"/><text x="316" y="753" font-size="12" fill="#eeeeee" font-weight="700">Break starts with a loop.</text><text x="316" y="778" font-size="12" fill="#aaaaaa" font-weight="400">Load your audio, set 1–4 bars,</text><text x="316" y="796" font-size="12" fill="#aaaaaa" font-weight="400">generate chops and play BRK PERF.</text><rect x="572" y="564" width="256" height="258" fill="#131515" stroke="#494b4b"/><text x="586" y="593" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">KEYGROUP</text><text x="586" y="626" font-size="23" fill="#eeeeee" font-weight="700">Across the keys.</text><text x="586" y="653" font-size="12" fill="#aaaaaa" font-weight="400">One sample or multisampled</text><text x="586" y="671" font-size="12" fill="#aaaaaa" font-weight="400">instrument, played chromatically or</text><text x="586" y="689" font-size="12" fill="#aaaaaa" font-weight="400">in scale. Shape its zones,</text><text x="586" y="707" font-size="12" fill="#aaaaaa" font-weight="400">envelopes and filter.</text><path d="M586,729 L814,729" stroke="#494b4b"/><text x="586" y="753" font-size="12" fill="#eeeeee" font-weight="700">One instrument, one track.</text><text x="586" y="778" font-size="12" fill="#aaaaaa" font-weight="400">Load SFZ, XPM, EXS, SoundFont,</text><text x="586" y="796" font-size="12" fill="#aaaaaa" font-weight="400">DecentSampler or a single WAV.</text><rect x="32" y="840" width="796" height="70" fill="none" stroke="#494b4b"/><text x="48" y="865" font-size="11" fill="#eeeeee" font-weight="700">FULL ADDS MIDI + AUDIO</text><text x="48" y="886" font-size="12" fill="#aaaaaa" font-weight="400">MIDI plays external gear through its port/channel. AUDIO records a pattern-length input take. A MIDI track alone</text><text x="48" y="904" font-size="12" fill="#aaaaaa" font-weight="400">makes no sound.</text><text x="204" y="942" font-size="10" fill="#aaaaaa" font-weight="400" class="mono">↓ NOTES LIVE IN PATTERNS · UP TO 128 PER TRACK</text><rect x="32" y="960" width="796" height="96" fill="none" stroke="#494b4b"/><text x="52" y="991" font-size="13" fill="#eeeeee" font-weight="700">PATTERNS</text><text x="52" y="1020" font-size="12" fill="#aaaaaa" font-weight="400">Build each part</text><text x="330" y="991" font-size="13" fill="#eeeeee" font-weight="700">SEQUENCES</text><text x="330" y="1020" font-size="12" fill="#aaaaaa" font-weight="400">Launch parts together</text><text x="628" y="991" font-size="13" fill="#eeeeee" font-weight="700">SONG</text><text x="628" y="1020" font-size="12" fill="#aaaaaa" font-weight="400">Arrange / export</text><text x="284" y="1005" font-size="24" fill="#aaaaaa" font-weight="400">→</text><text x="574" y="1005" font-size="24" fill="#aaaaaa" font-weight="400">→</text><text x="32" y="1102" font-size="19" fill="#eeeeee" font-weight="700">PRESETS → EDIT</text><text x="32" y="1131" font-size="12" fill="#aaaaaa" font-weight="400">Choose the sound, then shape it. PERFORM holds separate</text><text x="32" y="1149" font-size="12" fill="#aaaaaa" font-weight="400">track effects. GEN makes ideas; Acid / Break have their</text><text x="32" y="1167" font-size="12" fill="#aaaaaa" font-weight="400">own workflows.</text><text x="436" y="1102" font-size="19" fill="#eeeeee" font-weight="700">TRACKS → MIX</text><text x="436" y="1131" font-size="12" fill="#aaaaaa" font-weight="400">Balance levels, sends A–D and effects. Engine effects,</text><text x="436" y="1149" font-size="12" fill="#aaaaaa" font-weight="400">track inserts and bus effects remain separate stages.</text><rect x="32" y="1222" width="796" height="112" fill="#eeeeee" stroke="#eeeeee"/><text x="48" y="1250" font-size="12" fill="#0c0d0d" font-weight="700">PROJECT SAVE</text><text x="48" y="1275" font-size="12" fill="#0c0d0d" font-weight="400">B1 SAVE keeps your named file. SHIFT + B1: SAVE AS.</text><text x="48" y="1293" font-size="12" fill="#0c0d0d" font-weight="400">Idle autosave updates a separate recovery copy.</text><text x="438" y="1250" font-size="12" fill="#0c0d0d" font-weight="700">USER SOUND / USER KIT</text><text x="438" y="1275" font-size="12" fill="#0c0d0d" font-weight="400">A reusable instrument or kit preset. Keep the original</text><text x="438" y="1293" font-size="12" fill="#0c0d0d" font-weight="400">sample audio too.</text><text x="32" y="1370" font-size="12" fill="#aaaaaa" font-weight="400">SAMPLE opens a track’s sound. SEQ opens SEQUENCES; B1 opens PATTERNS. TRACK SETUP changes its role; DELETE TRACK is a</text><text x="32" y="1388" font-size="12" fill="#aaaaaa" font-weight="400">separate confirmed action.</text></svg>